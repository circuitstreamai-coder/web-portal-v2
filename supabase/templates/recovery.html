<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td style="font-size:20px;font-weight:bold;padding-bottom:16px;">Innoserve Portal</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;padding-bottom:24px;">
                We received a request to reset the password for your Innoserve Portal
                account.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:12px 24px;border-radius:6px;">
                  Reset your password
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#616e7c;">
                This link can be used once and expires after a short time. If you didn't request
                a reset, you can ignore this email; your password won't change.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
