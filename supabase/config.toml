project_id = "innoserve-portal"

[api]
enabled = true
schemas = ["public", "graphql_public", "portal", "ticket", "inventory"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "25MiB"

[functions.api]
verify_jwt = false

[functions.graphql]
verify_jwt = false

[functions.bootstrap-admin]
verify_jwt = false

[functions.inbound-email]
verify_jwt = false

[functions.migrate-users]
verify_jwt = false
