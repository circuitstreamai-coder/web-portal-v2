[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to the backend (Railway).
# These redirects are only used for a Netlify deployment. The Vercel deployment
# uses PRIVATE_API_BASE_URL through src/hooks.server.ts instead.
[[redirects]]
  from = "/graphql"
  to = "https://api-production-7469.up.railway.app/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/upload"
  to = "https://api-production-7469.up.railway.app/upload"
  status = 200
  force = true

[[redirects]]
  from = "/file/*"
  to = "https://api-production-7469.up.railway.app/file/:splat"
  status = 200
  force = true

# Auth REST endpoints (Fastify JWT)
[[redirects]]
  from = "/api/*"
  to = "https://api-production-7469.up.railway.app/api/:splat"
  status = 200
  force = true
